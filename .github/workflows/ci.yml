# CI do meikyu-caliope. Descrição completa em docs/ci-cd.md.
#
# Adaptada da CI do knowledge-os (feefe4d). Diferenças: o guarda de dados roda
# em todo PR; os testes rodam no Windows (obrigatório) e no Linux (informativo);
# o merge automático vale só para PR só de documentação (decisão D-08 do
# Issei). PR de código, testes, CI, configuração do agente ou dados espera o
# Issei. Ainda não há release: o pacote nasce na etapa E1.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classificar mudanças
    runs-on: ubuntu-latest
    outputs:
      system: ${{ steps.classify.outputs.system }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/ci/classify_changes.py "$BASE" "$HEAD"
          else
            # Push na main e execução manual: roda tudo.
            echo "system=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
          fi

  dados:
    name: Sem dado real no repositório
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_dados.py

  docs:
    name: Documentação
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_docs.py

  tests:
    name: Testes ${{ matrix.os }} (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: ${{ matrix.os }}
    # RNF-01: o Windows é obrigatório. O Linux é informativo e não bloqueia.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -c "import sqlite3, sys; print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - name: Instalar o pacote (quando existir)
        run: |
          if [ -f pyproject.toml ]; then python -m pip install -e . ; else echo "sem pyproject.toml: etapa E1 ainda não começou"; fi
      - run: python scripts/verificar.py --rapido

  lint:
    name: Ruff
    needs: changes
    if: needs.changes.outputs.system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check .

  ci-ok:
    name: CI ok
    needs: [changes, dados, docs, tests, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs necessários passaram
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for required in ("changes", "dados"):
              if needs[required]["result"] != "success":
                  bad[required] = needs[required]["result"]
          print("falhas:", bad or "nenhuma")
          sys.exit(1 if bad else 0)
          PY

  automerge:
    name: Merge automático (só documentação)
    needs: [changes, ci-ok]
    # D-08: só PR sem nada de "sistema" entra sozinho. Sem !cancelled(), o GitHub
    # pula este job quando algum job anterior foi pulado (tests e lint num PR só
    # de documentação), mesmo com ci-ok verde (aconteceu no knowledge-os, PR #14).
    if: >-
      !cancelled() &&
      needs.ci-ok.result == 'success' &&
      needs.changes.outputs.system == 'false' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash merge na main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit impede o merge se alguém empurrou um commit novo
        # depois que esta execução começou.
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA"
